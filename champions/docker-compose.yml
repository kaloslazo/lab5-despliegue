services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-champions}
      POSTGRES_USER: ${POSTGRES_USER:-champions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/kaloslazo/champions-predictor:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-champions}
      DB_USER: ${POSTGRES_USER:-champions}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FOOTBALL_DATA_TOKEN: ${FOOTBALL_DATA_TOKEN:-}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
