spring.application.name=champions
server.port=${PORT:8080}

# sin DB_URL usa H2 en memoria (para correr local rapido)
spring.datasource.url=${DB_URL:jdbc:h2:mem:champions}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

football-data.base-url=${FOOTBALL_DATA_URL:https://api.football-data.org/v4}
football-data.token=${FOOTBALL_DATA_TOKEN:}
football-data.competition=${FOOTBALL_DATA_COMPETITION:CL}
server.servlet.session.tracking-modes=cookie
