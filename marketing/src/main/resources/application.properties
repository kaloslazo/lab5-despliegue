spring.application.name=marketing
server.port=${PORT:8080}
server.servlet.session.tracking-modes=cookie

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/marketing}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

app.media-dir=${MEDIA_DIR:./data/media}
# URL publica de la app, se usa para que Instagram descargue las fotos/video
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.ffmpeg=${FFMPEG_PATH:ffmpeg}

anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-opus-5-5}

instagram.graph-url=${INSTAGRAM_GRAPH_URL:https://graph.facebook.com/v23.0}
instagram.user-id=${INSTAGRAM_USER_ID:}
instagram.token=${INSTAGRAM_TOKEN:}
