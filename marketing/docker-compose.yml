services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
      POSTGRES_USER: ${POSTGRES_USER:-marketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/kaloslazo/marketing-app:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-marketing}
      DB_USER: ${POSTGRES_USER:-marketing}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-}
      INSTAGRAM_TOKEN: ${INSTAGRAM_TOKEN:-}
    volumes:
      - media:/data/media
    ports:
      - "${APP_PORT:-8081}:8080"

volumes:
  pgdata:
  media:
